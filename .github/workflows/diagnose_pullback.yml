name: V8.2 Signal Filter Diagnosis

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Daily candle history"
        required: true
        type: choice
        options:
          - 5y
          - 2y
          - 10y
        default: 5y

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: pip install pandas numpy yfinance requests

      - name: Verify frozen V8.1 diagnostic parity
        run: |
          python -m compileall -q signal_models.py diagnose_pullback_v2.py tests/test_pullback_funnel.py
          python -m unittest discover -s tests -p 'test_pullback_funnel.py' -v

      - name: Diagnose V8.1 BUY and SELL gates
        run: |
          python diagnose_pullback_v2.py --period "${{ inputs.period }}" --split 0.70 --output-dir research_outputs

      - name: Upload filter breakdown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v82-signal-filter-breakdown
          path: research_outputs/
          if-no-files-found: warn
