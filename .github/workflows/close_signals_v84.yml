name: V8.4 Close-Only FX Signal Benchmark

on:
  workflow_dispatch:
    inputs:
      period:
        description: "FX daily history"
        required: true
        type: choice
        options:
          - 5y
          - 2y
          - 10y
        default: 5y
      horizon:
        description: "Holding bars after simulated next-close entry"
        type: number
        default: 5

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy yfinance requests

      - name: Run close-only regression tests
        run: |
          python -m compileall -q signal_models.py research_close_signals.py tests/test_close_signals.py
          python -m unittest discover -s tests -p 'test_close_signals.py' -v

      - name: Run retrospective close-only comparison
        run: |
          python research_close_signals.py --period "${{ inputs.period }}" --horizon "${{ inputs.horizon }}" --cost-bps 4 --split .70 --output-dir research_outputs

      - name: Export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v84-close-only-fx-research
          path: research_outputs/
          if-no-files-found: warn
