
name: Evaluate Forex Predictions

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Validate Python sources
        run: python -m compileall -q app.py collect_predictions.py evaluate_predictions.py prediction_monitor.py prediction_store.py signal_models.py tests

      - name: Regression-test forward evaluation logic
        run: python -m unittest discover -s tests -v

      - name: Evaluate pending predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python evaluate_predictions.py
