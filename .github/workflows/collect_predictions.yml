name: Collect forward predictions
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only; do not save to Supabase'
        type: boolean
        required: true
        default: true
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance requests streamlit
      - name: Collect signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python collect_predictions.py --dry-run
          else
            python collect_predictions.py
          fi
